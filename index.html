<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meteo Multi-Modello - Oggi e Domani</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --dry: #10b981;
      --warn: #f59e0b;
      --wet: #3b82f6;
      --snow: #e2e8f0;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; max-width: 850px; margin: 0 auto; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; }
    .title-area { flex: 1; min-width: 220px; }
    h1 { font-size: 1.25rem; margin-bottom: 2px; }
    .sub { font-size: 0.82rem; color: var(--muted); }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    input[type="text"] {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; width: 165px; outline: none;
    }
    input[type="text"]:focus { border-color: #3b82f6; }
    button {
      background: #2563eb; color: white; border: none; padding: 10px 14px;
      border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.88rem;
    }
    button.btn-secondary {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
    }
    button.btn-secondary:hover { border-color: #3b82f6; }
    button.btn-active {
      background: #0284c7; border: 1px solid #38bdf8; color: white;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.6; cursor: wait; }
    .verdict {
      padding: 16px; border-radius: 12px; margin-bottom: 16px;
      font-weight: 700; font-size: 1.05rem; border: 1px solid var(--border);
    }
    .verdict.dry { background: rgba(16, 185, 129, 0.15); border-color: var(--dry); color: #6ee7b7; }
    .verdict.warn { background: rgba(245, 158, 11, 0.15); border-color: var(--warn); color: #fcd34d; }
    .verdict.wet { background: rgba(59, 130, 246, 0.2); border-color: var(--wet); color: #93c5fd; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px;
    }
    .card h2 { font-size: 0.9rem; margin-bottom: 4px; color: var(--muted); }
    .status { font-size: 1.05rem; font-weight: 700; margin: 6px 0; }
    .status.dry { color: var(--dry); }
    .status.wet { color: #60a5fa; }
    .status.snow { color: var(--snow); }
    .details { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
    .wind-highlight { color: #cbd5e1; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; font-size: 0.82rem; }
    th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--border); }
    th { background: #0b1120; color: var(--muted); font-weight: 600; }
    tr.past { opacity: 0.45; }
    tr.now { background: rgba(37, 99, 235, 0.2); font-weight: 700; }
    .pill-wet { display: inline-block; background: rgba(59, 130, 246, 0.25); color: #93c5fd; padding: 2px 5px; border-radius: 4px; font-weight: 600; margin-bottom: 2px; }
    .pill-snow { display: inline-block; background: rgba(226, 232, 240, 0.25); color: #fff; padding: 2px 5px; border-radius: 4px; font-weight: 600; margin-bottom: 2px; }
    .wind-cell { display: block; font-size: 0.75rem; color: var(--muted); }
    .wind-strong { color: #fbbf24; font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <h1 id="cityTitle">Meteo Crema - Oggi</h1>
      <div class="sub" id="lastUpdate">In attesa di aggiornamento...</div>
    </div>
    <div class="controls">
      <input type="text" id="cityInput" value="Crema" placeholder="Inserisci città..." onkeydown="if(event.key==='Enter') searchAndFetch(selectedDay)">
      <button id="refreshBtn" onclick="searchAndFetch(0)">Oggi (Aggiorna)</button>
      <button id="tomorrowBtn" class="btn-secondary" onclick="searchAndFetch(1)">Controlla per domani</button>
    </div>
  </header>

  <div id="verdictBox" class="verdict">Caricamento modelli meteo in corso...</div>

  <div class="grid" id="modelsGrid"></div>

  <table>
    <thead>
      <tr>
        <th>Ora</th>
        <th>ECMWF</th>
        <th>ICON-D2</th>
        <th>GFS</th>
        <th>AROME</th>
      </tr>
    </thead>
    <tbody id="hourlyBody"></tbody>
  </table>

  <script>
    var MODELS = [
      { id: 'ecmwf_ifs025', name: 'ECMWF (Europeo)' },
      { id: 'icon_d2', name: 'ICON-D2 (Tedesco)' },
      { id: 'gfs_global', name: 'GFS (Americano)' },
      { id: 'meteofrance_arome_france_hd', name: 'AROME (MeteoFrance)' }
    ];

    var currentLoc = {
      name: 'Crema',
      detail: 'Lombardia, Italia',
      lat: 45.363,
      lon: 9.687
    };

    var selectedDay = 0; // 0 = Oggi, 1 = Domani

    function padZero(num) {
      return num < 10 ? '0' + num : '' + num;
    }

    function updateButtonsState(loading) {
      var btnToday = document.getElementById('refreshBtn');
      var btnTomorrow = document.getElementById('tomorrowBtn');
      btnToday.disabled = loading;
      btnTomorrow.disabled = loading;

      if (loading) {
        if (selectedDay === 0) btnToday.textContent = 'Aggiorno...';
        else btnTomorrow.textContent = 'Carico domani...';
      } else {
        btnToday.textContent = selectedDay === 0 ? 'Aggiorna oggi' : 'Torna a oggi';
        btnTomorrow.textContent = selectedDay === 1 ? 'Aggiorna domani' : 'Controlla per domani';
        btnToday.className = selectedDay === 0 ? '' : 'btn-secondary';
        btnTomorrow.className = selectedDay === 1 ? 'btn-active' : 'btn-secondary';
      }
    }

    async function searchAndFetch(dayOffset) {
      if (typeof dayOffset === 'number') {
        selectedDay = dayOffset;
      }

      var query = document.getElementById('cityInput').value.trim();
      if (!query) return;

      updateButtonsState(true);

      try {
        if (query.toLowerCase() !== currentLoc.name.toLowerCase()) {
          var geoUrl = 'https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(query) + '&count=1&language=it&format=json';
          var geoRes = await fetch(geoUrl);
          if (!geoRes.ok) throw new Error('Errore ricerca città');
          var geoData = await geoRes.json();

          if (!geoData.results || geoData.results.length === 0) {
            throw new Error('Città "' + query + '" non trovata.');
          }

          var place = geoData.results[0];
          var parts = [];
          if (place.admin2) parts.push(place.admin2);
          if (place.admin1) parts.push(place.admin1);
          if (place.country) parts.push(place.country);

          currentLoc = {
            name: place.name,
            detail: parts.join(', '),
            lat: place.latitude,
            lon: place.longitude
          };
        }

        var modelIds = MODELS.map(function(m) { return m.id; }).join(',');
        var weatherUrl = 'https://api.open-meteo.com/v1/forecast?latitude=' + currentLoc.lat + '&longitude=' + currentLoc.lon + '&hourly=precipitation,rain,snowfall,precipitation_probability,wind_speed_10m,wind_gusts_10m&models=' + modelIds + '&forecast_days=2&timezone=Europe%2FRome';

        var res = await fetch(weatherUrl);
        if (!res.ok) throw new Error('Errore risposta API meteo (' + res.status + ')');
        var data = await res.json();
        render(data);
      } catch (err) {
        document.getElementById('verdictBox').className = 'verdict warn';
        document.getElementById('verdictBox').textContent = 'Attenzione: ' + err.message;
      } finally {
        updateButtonsState(false);
      }
    }

    function render(data) {
      var now = new Date();
      var currentHour = now.getHours();
      var targetDate = new Date(now);
      targetDate.setDate(now.getDate() + selectedDay);

      var dayLabel = selectedDay === 0 ? 'Oggi' : 'Domani';
      var targetDateStr = targetDate.toLocaleDateString('it-IT', { weekday: 'short', day: '2-digit', month: '2-digit' });
      var timeStr = now.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      document.getElementById('cityTitle').textContent = 'Meteo ' + currentLoc.name + ' - ' + dayLabel + ' (' + targetDateStr + ')';
      document.getElementById('lastUpdate').textContent = currentLoc.detail + ' | Aggiornato alle ' + timeStr;

      var startIdx = selectedDay * 24;
      var endIdx = startIdx + 24;

      var wetModelsCount = 0;
      var snowDetected = false;
      var maxWindOverall = 0;
      var grid = document.getElementById('modelsGrid');
      grid.innerHTML = '';

      MODELS.forEach(function(model) {
        var precip = data.hourly['precipitation_' + model.id] || [];
        var snow = data.hourly['snowfall_' + model.id] || [];
        var prob = data.hourly['precipitation_probability_' + model.id] || [];
        var wind = data.hourly['wind_speed_10m_' + model.id] || [];
        var gusts = data.hourly['wind_gusts_10m_' + model.id] || [];

        var totalMm = 0;
        var totalSnowCm = 0;
        var maxProb = 0;
        var maxWind = 0;
        var maxGust = 0;
        var wetHours = [];

        for (var i = startIdx; i < endIdx; i++) {
          var hourOfDay = i - startIdx;
          var p = precip[i] || 0;
          var s = snow[i] || 0;
          var pr = prob[i] || 0;
          var w = wind[i] || 0;
          var g = gusts[i] || 0;

          totalMm += p;
          totalSnowCm += s;
          if (pr > maxProb) maxProb = pr;
          if (w > maxWind) maxWind = w;
          if (g > maxGust) maxGust = g;
          if (p >= 0.1 || s >= 0.1) {
            wetHours.push(padZero(hourOfDay) + ':00');
          }
        }

        if (maxWind > maxWindOverall) maxWindOverall = maxWind;

        var hasSnow = totalSnowCm >= 0.1;
        var hasRain = totalMm >= 0.1;
        if (hasRain || hasSnow) wetModelsCount++;
        if (hasSnow) snowDetected = true;

        var statusText = 'Asciutto';
        var statusClass = 'dry';
        if (hasSnow) {
          statusText = 'Neve (' + totalSnowCm.toFixed(1) + ' cm)';
          statusClass = 'snow';
        } else if (hasRain) {
          statusText = 'Pioggia (' + totalMm.toFixed(1) + ' mm)';
          statusClass = 'wet';
        }

        var hoursInfo = wetHours.length > 0
          ? 'Ore: ' + wetHours[0] + ' - ' + wetHours[wetHours.length - 1] + ' (' + wetHours.length + 'h)'
          : 'Nessuna precipitazione';

        var probText = maxProb > 0 ? maxProb + '%' : 'N/D';
        var windText = Math.round(maxWind) + ' km/h' + (maxGust > 0 ? ' (raffiche ' + Math.round(maxGust) + ')' : '');

        grid.innerHTML +=
          '<div class="card">' +
            '<h2>' + model.name + '</h2>' +
            '<div class="status ' + statusClass + '">' + statusText + '</div>' +
            '<div class="details">' +
              'Prob. max: ' + probText + '<br>' +
              hoursInfo + '<br>' +
              '<span class="wind-highlight">Vento max: ' + windText + '</span>' +
            '</div>' +
          '</div>';
      });

      var verdictBox = document.getElementById('verdictBox');
      var verdictPrefix = 'VERDETTO ' + dayLabel.toUpperCase() + ': ';
      var windSummary = ' | Vento max: ~' + Math.round(maxWindOverall) + ' km/h';

      if (wetModelsCount === 0) {
        verdictBox.className = 'verdict dry';
        verdictBox.textContent = verdictPrefix + 'Asciutto su tutti e 4 i modelli (0/4)' + windSummary;
      } else if (wetModelsCount <= 2) {
        verdictBox.className = 'verdict warn';
        verdictBox.textContent = verdictPrefix + 'Incerto - ' + wetModelsCount + '/4 modelli prevedono ' + (snowDetected ? 'neve/pioggia' : 'pioggia') + windSummary;
      } else {
        verdictBox.className = 'verdict wet';
        verdictBox.textContent = verdictPrefix + (snowDetected ? 'Neve/Pioggia' : 'Pioggia') + ' confermata (' + wetModelsCount + '/4 modelli)' + windSummary;
      }

      var tbody = document.getElementById('hourlyBody');
      tbody.innerHTML = '';
      for (var i = startIdx; i < endIdx; i++) {
        var hourOfDay = i - startIdx;
        var rowClass = '';
        if (selectedDay === 0) {
          rowClass = hourOfDay < currentHour ? 'past' : (hourOfDay === currentHour ? 'now' : '');
        }
        var cells = '<td>' + padZero(hourOfDay) + ':00</td>';

        MODELS.forEach(function(model) {
          var p = (data.hourly['precipitation_' + model.id] || [])[i] || 0;
          var s = (data.hourly['snowfall_' + model.id] || [])[i] || 0;
          var w = (data.hourly['wind_speed_10m_' + model.id] || [])[i] || 0;

          var precipHtml = '';
          if (s >= 0.1) {
            precipHtml = '<span class="pill-snow">Neve ' + s.toFixed(1) + 'cm</span>';
          } else if (p >= 0.1) {
            precipHtml = '<span class="pill-wet">Pioggia ' + p.toFixed(1) + 'mm</span>';
          } else {
            precipHtml = 'Asciutto';
          }

          var windClass = w >= 30 ? 'wind-cell wind-strong' : 'wind-cell';
          var windHtml = '<span class="' + windClass + '">' + Math.round(w) + ' km/h</span>';

          cells += '<td>' + precipHtml + windHtml + '</td>';
        });

        tbody.innerHTML += '<tr class="' + rowClass + '">' + cells + '</tr>';
      }
    }

    searchAndFetch(0);
  </script>
</body>
</html>
